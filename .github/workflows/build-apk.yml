name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PhoneMic.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneMic-apk
          path: PhoneMic.apk

      - name: Publish to the "latest" release (easy download from the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Phone Mic (latest APK)
          body: "Download PhoneMic.apk below and install it on your phone."
          files: PhoneMic.apk
